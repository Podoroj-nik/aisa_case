<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сириус — Афиша мероприятий</title>
    <!-- Markdown-рендерер -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --teal: #88d0c4;
            --teal-deep: #65bab6;
            --bg-light: #f4f9f8;
            --white: #ffffff;
            --text-muted: #616060;
            --text-dark: #2c3e50;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius: 16px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ─────────────────────────── */
        .header {
            background: var(--white);
            border-bottom: 1px solid rgba(101, 186, 182, 0.2);
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.92);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo-img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .header-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-light);
            border: 1px solid rgba(136, 208, 196, 0.3);
            border-radius: 40px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .header-link:hover {
            background: var(--teal);
            color: var(--white);
            border-color: var(--teal);
            box-shadow: 0 4px 14px rgba(136, 208, 196, 0.35);
        }

        /* ── Hero ──────────────────────────── */
        .hero {
            background: linear-gradient(160deg, var(--white) 0%, var(--bg-light) 60%);
            padding: 48px 32px 40px;
            text-align: center;
            border-bottom: 1px solid rgba(101, 186, 182, 0.15);
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 18px;
            background: rgba(136, 208, 196, 0.15);
            color: var(--teal-deep);
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto;
        }

        /* ── Container ─────────────────────── */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 36px 28px 60px;
        }

        /* ── Filters ──────────────────────── */
        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 10px 22px;
            border-radius: 40px;
            border: 1.5px solid rgba(101, 186, 182, 0.3);
            background: var(--white);
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-chip:hover {
            border-color: var(--teal);
            background: rgba(136, 208, 196, 0.06);
        }

        .filter-chip.active {
            background: var(--teal);
            color: var(--white);
            border-color: var(--teal);
            font-weight: 600;
        }

        .filter-chip .count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 6px;
        }

        .filter-chip.active .count {
            background: rgba(255, 255, 255, 0.35);
        }

        /* ── Events Grid ───────────────────── */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
            gap: 24px;
        }

        .event-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(101, 186, 182, 0.12);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(136, 208, 196, 0.35);
        }

        /* ── Card Image ────────────────────── */
        .event-card-image {
            position: relative;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #e8f5f2 0%, #d5ede9 100%);
            overflow: hidden;
        }

        .event-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }

        .event-card-image .placeholder-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--teal);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .event-card-image .type-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--teal-deep);
            box-shadow: var(--shadow-sm);
            z-index: 2;
        }

        /* ── Card Body ─────────────────────── */
        .event-card-body {
            padding: 22px 22px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .event-date-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .event-date-icon {
            width: 32px;
            height: 32px;
            background: rgba(136, 208, 196, 0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .event-date-text {
            font-size: 0.85rem;
            color: var(--teal-deep);
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .event-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.4;
            letter-spacing: -0.2px;
        }

        .event-place {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .event-place-icon {
            flex-shrink: 0;
            margin-top: 1px;
        }

        .event-time-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: var(--bg-light);
            border-radius: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: auto;
            margin-bottom: 14px;
            width: fit-content;
        }

        /* ── AI Button ─────────────────────── */
        .btn-ai {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--teal), var(--teal-deep));
            color: var(--white);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(101, 186, 182, 0.25);
        }

        .btn-ai:hover {
            box-shadow: 0 6px 18px rgba(101, 186, 182, 0.4);
            transform: translateY(-1px);
        }

        .btn-ai:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(101, 186, 182, 0.3);
        }

        .btn-ai:disabled {
            background: #c5dfda;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ai .sparkle {
            font-size: 1rem;
        }

        /* ── MODAL OVERLAY ─────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ── MODAL CARD ────────────────────── */
        .modal-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-image {
            width: 100%;
            height: 240px;
            background: linear-gradient(135deg, #e8f5f2 0%, #d5ede9 100%);
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }

        .modal-image .placeholder-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--teal);
            opacity: 0.4;
            z-index: 0;
        }

        .modal-image .type-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 7px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--teal-deep);
            box-shadow: var(--shadow-sm);
            z-index: 2;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            z-index: 3;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .modal-close:hover {
            background: var(--white);
            transform: scale(1.05);
        }

        .modal-body {
            padding: 28px;
        }

        .modal-date {
            font-size: 0.9rem;
            color: var(--teal-deep);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
            line-height: 1.3;
            letter-spacing: -0.4px;
        }

        .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(101, 186, 182, 0.15);
        }

        .modal-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .modal-meta-icon {
            width: 36px;
            height: 36px;
            background: rgba(136, 208, 196, 0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        /* ── AI Response in Modal ──────────── */
        .modal-ai-section {
            background: var(--bg-light);
            border-radius: var(--radius);
            padding: 20px;
            border-left: 4px solid var(--teal);
        }

        .modal-ai-header {
            font-weight: 700;
            color: var(--teal-deep);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-ai-content {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-dark);
        }

        /* ── Стили для Markdown-контента ──── */
        .modal-ai-content h1,
        .modal-ai-content h2,
        .modal-ai-content h3,
        .modal-ai-content h4 {
            color: var(--text-dark);
            margin: 16px 0 8px;
            font-weight: 700;
            line-height: 1.3;
        }

        .modal-ai-content h1 { font-size: 1.4rem; }
        .modal-ai-content h2 { font-size: 1.2rem; }
        .modal-ai-content h3 { font-size: 1.05rem; }
        .modal-ai-content h4 { font-size: 0.95rem; }

        .modal-ai-content p {
            margin-bottom: 10px;
        }

        .modal-ai-content ul,
        .modal-ai-content ol {
            margin: 8px 0 12px 20px;
        }

        .modal-ai-content li {
            margin-bottom: 4px;
        }

        .modal-ai-content strong {
            color: var(--text-dark);
            font-weight: 700;
        }

        .modal-ai-content em {
            color: var(--text-muted);
        }

        .modal-ai-content code {
            background: rgba(101, 186, 182, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            color: var(--teal-deep);
        }

        .modal-ai-content pre {
            background: #f0f4f3;
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .modal-ai-content pre code {
            background: none;
            padding: 0;
            color: var(--text-dark);
        }

        .modal-ai-content blockquote {
            border-left: 3px solid var(--teal);
            padding: 8px 14px;
            margin: 10px 0;
            color: var(--text-muted);
            background: rgba(136, 208, 196, 0.06);
            border-radius: 0 6px 6px 0;
        }

        .modal-ai-content a {
            color: var(--teal-deep);
            text-decoration: underline;
        }

        .modal-ai-content hr {
            border: none;
            border-top: 1px solid rgba(101, 186, 182, 0.2);
            margin: 16px 0;
        }

        .modal-ai-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        .modal-ai-content th,
        .modal-ai-content td {
            border: 1px solid rgba(101, 186, 182, 0.2);
            padding: 8px 12px;
            text-align: left;
        }

        .modal-ai-content th {
            background: rgba(136, 208, 196, 0.1);
            font-weight: 600;
        }

        .modal-ai-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ── Pulse animation ──────────────── */
        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--teal-deep);
            border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
        .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ── Empty State ──────────────────── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ── Footer ────────────────────────── */
        .footer {
            text-align: center;
            padding: 28px;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid rgba(101, 186, 182, 0.12);
            background: var(--white);
        }

        .footer a {
            color: var(--teal-deep);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* ── Responsive ────────────────────── */
        @media (max-width: 768px) {
            .header {
                padding: 0 16px;
                height: 64px;
            }
            .header-logo-img {
                height: 34px;
            }
            .header-title {
                font-size: 0.95rem;
            }
            .header-subtitle {
                display: none;
            }
            .hero {
                padding: 32px 16px 28px;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .container {
                padding: 20px 12px 40px;
            }
            .events-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .event-card-image {
                height: 170px;
            }
            .modal-card {
                max-height: 90vh;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            }
            .modal-image {
                height: 180px;
            }
            .modal-body {
                padding: 20px;
            }
            .modal-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════════ HEADER ═══════════════ -->
    <header class="header">
        <div class="header-brand">
            <img
                class="header-logo-img"
                src="https://gymnasium.sirius-ft.ru/upload/iblock/acf/ddvpzr3nr10wb3jk8iityklj9tzjk07w.png"
                alt="Федеральная территория «Сириус»"
            >
            <div class="header-title-group">
                <span class="header-title">Афиша</span>
                <span class="header-subtitle">Федеральная территория «Сириус»</span>
            </div>
        </div>
        <a href="/admin" class="header-link">
            <span>🔐</span> Админ-панель
        </a>
    </header>

    <!-- ═══════════════ HERO ════════════════ -->
    <section class="hero">
        <div class="hero-badge">✨ ИИ-помощник</div>
        <h1>Культурная жизнь Сириуса</h1>
        <p>Все мероприятия федеральной территории в одном окне. Нажмите «Подробнее от ИИ», чтобы узнать больше о любом событии.</p>
    </section>

    <!-- ═══════════════ MAIN ════════════════ -->
    <div class="container">
        <div class="filters-bar" id="filtersBar">
            <button class="filter-chip active" data-type="all">
                Все <span class="count" id="countAll">—</span>
            </button>
        </div>

        <div class="events-grid" id="eventsContainer">
            <!-- Динамическое наполнение -->
        </div>
    </div>

    <!-- ═══════════════ MODAL ═══════════════ -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-card" id="modalCard">
            <!-- Динамическое наполнение -->
        </div>
    </div>

    <!-- ═══════════════ FOOTER ══════════════ -->
    <footer class="footer">
        Федеральная территория «Сириус» &nbsp;·&nbsp;
        <a href="https://pro.sirius-ft.ru" target="_blank" rel="noopener">pro.sirius-ft.ru</a>
    </footer>

    <script>
        // ── Настройка marked.js ──────────────────
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,        // Перенос строк как <br>
                gfm: true,           // GitHub Flavored Markdown
                headerIds: false,
                mangle: false
            });
        }

        let allEvents = [];
        let activeType = 'all';

        // ── Загрузка мероприятий ──────────────────
        async function loadEvents() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <h3>Загружаем мероприятия...</h3>
                    <p>Получаем актуальную афишу</p>
                </div>`;

            try {
                const res = await fetch('/api/afisha/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });

                if (!res.ok) throw new Error(`Сервер вернул ${res.status}`);

                const data = await res.json();
                allEvents = data.payload?.events || [];

                if (allEvents.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>Мероприятий пока нет</h3>
                            <p>Загляните позже — афиша обновляется</p>
                        </div>`;
                    return;
                }

                buildFilters();
                renderEvents();
            } catch (e) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Не удалось загрузить афишу</h3>
                        <p>${escapeHtml(e.message)}</p>
                    </div>`;
            }
        }

        // ── Построение фильтров ──────────────────
        function buildFilters() {
            const types = [...new Set(allEvents.map(e => e.afishaTypeName).filter(Boolean))];
            const bar = document.getElementById('filtersBar');

            bar.innerHTML = `
                <button class="filter-chip active" data-type="all">
                    Все <span class="count" id="countAll">${allEvents.length}</span>
                </button>`;

            types.forEach(type => {
                const count = allEvents.filter(e => e.afishaTypeName === type).length;
                bar.innerHTML += `
                    <button class="filter-chip" data-type="${escapeAttr(type)}">
                        ${escapeHtml(type)} <span class="count">${count}</span>
                    </button>`;
            });

            bar.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    activeType = chip.dataset.type;
                    renderEvents();
                });
            });
        }

        // ── Отрисовка карточек ───────────────────
        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            const filtered = activeType === 'all'
                ? allEvents
                : allEvents.filter(e => e.afishaTypeName === activeType);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>Ничего не найдено</h3>
                        <p>Попробуйте выбрать другую категорию</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(event => {
                const hasImage = !!(event.eventImage?.url);

                return `
                <article class="event-card" id="event-${event.eventId}">
                    <div class="event-card-image">
                        ${hasImage
                            ? `<img src="${escapeAttr(event.eventImage.url)}" alt="${escapeAttr(event.eventName)}" loading="lazy" onerror="handleImageError(this)">`
                            : ''}
                        <div class="placeholder-icon" style="display:${hasImage ? 'flex' : 'flex'}">📅</div>
                        <span class="type-badge">${escapeHtml(event.afishaTypeName || 'Мероприятие')}</span>
                    </div>
                    <div class="event-card-body">
                        <div class="event-date-row">
                            <div class="event-date-icon">📆</div>
                            <span class="event-date-text">${escapeHtml(event.eventStartDate || '')}</span>
                        </div>
                        <h3 class="event-name">${escapeHtml(event.eventName)}</h3>
                        <div class="event-place">
                            <span class="event-place-icon">📍</span>
                            <span>${escapeHtml(event.eventPlace || 'Площадка уточняется')}</span>
                        </div>
                        <div class="event-time-badge">
                            🕐 ${escapeHtml(event.eventStartTime || '—')} – ${escapeHtml(event.eventEndTime || '—')}
                        </div>
                        <button class="btn-ai" onclick="openModal(${event.eventId})">
                            <span class="sparkle">✨</span> Подробнее от ИИ
                        </button>
                    </div>
                </article>`;
            }).join('');
        }

        // ── Обработчик ошибки загрузки изображения ──
        function handleImageError(img) {
            img.style.display = 'none';
        }

        // ── Открытие модального окна ─────────────
        function openModal(eventId) {
            const event = allEvents.find(e => e.eventId === eventId);
            if (!event) return;

            const overlay = document.getElementById('modalOverlay');
            const card = document.getElementById('modalCard');
            const hasImage = !!(event.eventImage?.url);

            card.innerHTML = `
                <div class="modal-image">
                    ${hasImage
                        ? `<img src="${escapeAttr(event.eventImage.url)}" alt="${escapeAttr(event.eventName)}" onerror="this.style.display='none';">`
                        : ''}
                    <div class="placeholder-icon">📅</div>
                    <span class="type-badge">${escapeHtml(event.afishaTypeName || 'Мероприятие')}</span>
                    <button class="modal-close" onclick="closeModal()" title="Закрыть">✕</button>
                </div>
                <div class="modal-body">
                    <div class="modal-date">${escapeHtml(event.eventStartDate || '')}</div>
                    <h2 class="modal-title">${escapeHtml(event.eventName)}</h2>
                    <div class="modal-meta">
                        <div class="modal-meta-item">
                            <div class="modal-meta-icon">📍</div>
                            <span>${escapeHtml(event.eventPlace || 'Площадка уточняется')}</span>
                        </div>
                        <div class="modal-meta-item">
                            <div class="modal-meta-icon">🕐</div>
                            <span>${escapeHtml(event.eventStartTime || '—')} – ${escapeHtml(event.eventEndTime || '—')}</span>
                        </div>
                        <div class="modal-meta-item">
                            <div class="modal-meta-icon">📌</div>
                            <span>${escapeHtml(event.afishaTypeName || 'Мероприятие')}</span>
                        </div>
                    </div>
                    <div class="modal-ai-section">
                        <div class="modal-ai-header">🤖 Ответ ИИ-агента</div>
                        <div class="modal-ai-loading" id="modalAiLoading">
                            <span class="pulse-dot"></span>
                            <span class="pulse-dot"></span>
                            <span class="pulse-dot"></span>
                            <span>Анализирую мероприятие...</span>
                        </div>
                        <div class="modal-ai-content hidden" id="modalAiContent"></div>
                    </div>
                </div>
            `;

            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            fetchAIDetails(event);
        }

        // ── Закрытие модального окна ─────────────
        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.addEventListener('click', function(e) {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ── Запрос к ИИ ──────────────────────────
        async function fetchAIDetails(event) {
            const loadingEl = document.getElementById('modalAiLoading');
            const contentEl = document.getElementById('modalAiContent');

            try {
                const res = await fetch('/api/afisha/event/ai-details', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        eventId: event.eventId,
                        eventName: event.eventName,
                        eventPlace: event.eventPlace || '',
                        eventStartDate: event.eventStartDate || '',
                        eventStartTime: event.eventStartTime || '',
                        eventEndTime: event.eventEndTime || '',
                        afishaTypeName: event.afishaTypeName || ''
                    })
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || `Ошибка ${res.status}`);
                }

                const data = await res.json();

                // ── Рендеринг Markdown → HTML ──────────
                let htmlContent;
                if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                    // marked.js v4+
                    htmlContent = marked.parse(data.response);
                } else if (typeof marked !== 'undefined' && typeof marked === 'function') {
                    // marked.js v0.x
                    htmlContent = marked(data.response);
                } else {
                    // Запасной вариант: простой текст с переносами строк
                    htmlContent = escapeHtml(data.response).replace(/\n/g, '<br>');
                }

                loadingEl.classList.add('hidden');
                contentEl.innerHTML = htmlContent;
                contentEl.classList.remove('hidden');

                // Прокручиваем модалку к началу ответа
                contentEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (e) {
                loadingEl.classList.add('hidden');
                contentEl.innerHTML = `<p style="color:#c0392b;">⚠️ Не удалось получить ответ: ${escapeHtml(e.message)}</p>`;
                contentEl.classList.remove('hidden');
            }
        }

        // ── Утилиты ──────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── Инициализация ────────────────────────
        document.addEventListener('DOMContentLoaded', loadEvents);
    </script>

</body>
</html>
