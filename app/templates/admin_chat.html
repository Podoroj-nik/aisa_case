<!-- Вставили сюда стили и скрипт, потому что на деплое с Nginx этот файл не видит файлы в Static -->

<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GigaChat UI</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap');

      :root {
        --primary: #88d0c4;
        --primary-dark: #65bab6;
        --bg-light: #f4f9f8;
        --white: #ffffff;
        --text-gray: #616060;
        --text-dark: #2c3e50;
        --border-light: #e0ecea;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: var(--bg-light);
        color: var(--text-dark);
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 320px 1fr;
        overflow: hidden;
      }

      .sidebar {
        background: var(--white);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }

      .sidebar-header {
        padding: 20px 16px;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex-shrink: 0;
      }

      .brand {
        font-weight: 700;
        font-size: 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.3px;
      }

      .btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--white);
        border: none;
        border-radius: 12px;
        padding: 10px 16px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn:active {
        transform: translateY(0);
      }

      .chat-list {
        padding: 12px;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }

      .chat-item {
        background: var(--white);
        border: 1px solid var(--border-light);
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex-shrink: 0;
        transition: all 0.2s ease;
        position: relative;
        padding: 12px;
      }

      .chat-item:hover {
        border-color: var(--primary);
        transform: translateX(2px);
        box-shadow: var(--shadow-sm);
      }

      .chat-item.active {
        border-color: var(--primary);
        background: linear-gradient(135deg, rgba(136, 208, 196, 0.08), rgba(101, 186, 182, 0.08));
      }

      .chat-content {
        width: 100%;
      }

      .chat-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      .chat-item .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .delete-chat-btn {
        background: transparent;
        border: none;
        color: var(--text-gray);
        font-size: 16px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        transition: all 0.2s ease;
        opacity: 0;
        flex-shrink: 0;
        line-height: 1;
      }

      .chat-item:hover .delete-chat-btn {
        opacity: 1;
      }

      .delete-chat-btn:hover {
        background: rgba(136, 208, 196, 0.2);
        color: var(--primary-dark);
        transform: scale(1.1);
      }

      .delete-chat-btn:active {
        transform: scale(0.95);
      }

      .chat-item .meta {
        font-size: 11px;
        color: var(--text-gray);
        margin-top: 2px;
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        overflow: hidden;
        background: var(--bg-light);
      }

      .topbar {
        background: var(--white);
        border-bottom: 1px solid var(--border-light);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        box-shadow: var(--shadow-sm);
      }

      .chat-title {
        font-weight: 700;
        font-size: 18px;
        color: var(--text-dark);
        letter-spacing: -0.3px;
      }

      .status {
        font-size: 12px;
        color: var(--primary);
        font-weight: 500;
      }

      .messages {
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex: 1;
        min-height: 0;
      }

      @keyframes fadeInSlideUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 12px;
        align-items: start;
        flex-shrink: 0;
        animation: fadeInSlideUp 0.3s ease;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        user-select: none;
        flex-shrink: 0;
      }

      .msg:has(.bubble.user) .avatar {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--white);
      }

      .msg:has(.bubble.assistant) .avatar {
        background: var(--white);
        color: var(--primary);
        border: 1px solid var(--border-light);
      }

      .bubble {
        padding: 12px 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
        max-width: 80%;
      }

      .bubble.user {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--white);
        border-radius: 16px 16px 6px 16px;
        margin-left: auto;
      }

      .bubble.assistant {
        background: var(--white);
        color: var(--text-dark);
        border-radius: 16px 16px 16px 6px;
        border: 1px solid var(--border-light);
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: var(--white);
        border-radius: 16px 16px 16px 6px;
        border: 1px solid var(--border-light);
        width: fit-content;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: var(--primary);
        border-radius: 50%;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .typing-dot:nth-child(1) { animation-delay: 0s; }
      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes pulse {
        0%, 60%, 100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        30% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      .composer {
        background: var(--white);
        border-top: 1px solid var(--border-light);
        padding: 16px 24px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        flex-shrink: 0;
      }

      .input {
        width: 100%;
        resize: none;
        border-radius: 16px;
        border: 1px solid var(--border-light);
        background: var(--bg-light);
        color: var(--text-dark);
        padding: 12px 16px;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        min-height: 44px;
        max-height: 180px;
        overflow: auto;
        transition: all 0.2s ease;
      }

      .input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(136, 208, 196, 0.2);
        background: var(--white);
      }

      .input::placeholder {
        color: var(--text-gray);
        opacity: 0.6;
      }

      .send {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--white);
        border: none;
        border-radius: 12px;
        padding: 0 20px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .send:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .send:active {
        transform: translateY(0);
      }

      .send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .bubble.assistant h1,
      .bubble.assistant h2,
      .bubble.assistant h3,
      .bubble.assistant h4,
      .bubble.assistant h5,
      .bubble.assistant h6 {
        margin-top: 0.8em;
        margin-bottom: 0.4em;
        font-weight: 600;
        color: var(--text-dark);
      }

      .bubble.assistant h1 { font-size: 1.6em; }
      .bubble.assistant h2 { font-size: 1.4em; }
      .bubble.assistant h3 { font-size: 1.2em; }

      .bubble.assistant p {
        margin: 0.5em 0;
      }

      .bubble.assistant ul,
      .bubble.assistant ol {
        margin: 0.5em 0;
        padding-left: 1.5em;
      }

      .bubble.assistant li {
        margin: 0.2em 0;
      }

      .bubble.assistant code {
        background: var(--bg-light);
        padding: 0.2em 0.4em;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        font-size: 0.9em;
        color: var(--primary-dark);
      }

      .bubble.assistant pre {
        background: var(--bg-light);
        padding: 0.8em;
        border-radius: 12px;
        overflow-x: auto;
        margin: 0.5em 0;
      }

      .bubble.assistant pre code {
        background: transparent;
        padding: 0;
        font-size: 0.9em;
        color: var(--text-dark);
      }

      .bubble.assistant blockquote {
        border-left: 3px solid var(--primary);
        margin: 0.5em 0;
        padding-left: 1em;
        color: var(--text-gray);
        font-style: italic;
      }

      .bubble.assistant table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.5em 0;
      }

      .bubble.assistant th,
      .bubble.assistant td {
        border: 1px solid var(--border-light);
        padding: 6px 10px;
        text-align: left;
      }

      .bubble.assistant th {
        background: var(--bg-light);
        font-weight: 600;
      }

      .bubble.assistant a {
        color: var(--primary-dark);
        text-decoration: none;
      }

      .bubble.assistant a:hover {
        text-decoration: underline;
      }

      .bubble.assistant hr {
        border: none;
        border-top: 1px solid var(--border-light);
        margin: 1em 0;
      }

      .bubble.assistant img {
        max-width: 100%;
        border-radius: 12px;
      }

      .bubble.assistant .katex {
        font-size: 1.05em;
      }

      .bubble.assistant .katex-display {
        margin: 0.8em 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.5em 0;
      }

      .bubble.assistant .katex .error {
        color: #e74c3c;
      }

      .messages::-webkit-scrollbar,
      .chat-list::-webkit-scrollbar {
        width: 6px;
      }

      .messages::-webkit-scrollbar-track,
      .chat-list::-webkit-scrollbar-track {
        background: var(--bg-light);
        border-radius: 3px;
      }

      .messages::-webkit-scrollbar-thumb,
      .chat-list::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 3px;
      }

      .messages::-webkit-scrollbar-thumb:hover,
      .chat-list::-webkit-scrollbar-thumb:hover {
        background: var(--primary-dark);
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .bubble {
          max-width: 90%;
        }
      }

      .welcome-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 40px 20px;
        max-width: 600px;
        margin: 0 auto;
        animation: fadeInSlideUp 0.5s ease;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
      }

      .messages {
        position: relative;
      }

      .welcome-icon {
        font-size: 80px;
        margin-bottom: 24px;
        animation: bounce 2s ease infinite;
      }

      @keyframes bounce {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .welcome-title {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-dark);
        margin: 0 0 16px 0;
        text-align: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .welcome-description {
        font-size: 16px;
        color: var(--text-gray);
        text-align: center;
        line-height: 1.5;
        margin: 0;
      }

      @media (max-width: 768px) {
        .welcome-title {
          font-size: 22px;
        }

        .welcome-description {
          font-size: 14px;
        }

        .welcome-icon {
          font-size: 60px;
        }
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">GigaChat UI</div>
          <button class="btn" id="newChatBtn" type="button">Новый чат</button>
        </div>
        <div class="chat-list" id="chatList"></div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="chat-title" id="chatTitle">Чат</div>
          <div class="status" id="status"></div>
        </div>

        <div class="messages" id="messages">
        </div>

        <form class="composer" id="composer">
          <textarea
            class="input"
            id="messageInput"
            rows="1"
            placeholder="Напишите сообщение…"
          ></textarea>
          <button class="send" id="sendBtn" type="submit">Отправить</button>
        </form>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <script>
      const state = {
        chats: [],
        activeChatId: null,
        loading: false,
      };

      function $(id) {
        return document.getElementById(id);
      }

      function formatDate(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleString();
        } catch {
          return "";
        }
      }

      function setStatus(text) {
        $("status").textContent = text || "";
      }

      function showWelcomeScreen() {
        const box = $("messages");
        box.innerHTML = `
          <div class="welcome-container">
            <div class="welcome-icon">🤖</div>
            <h1 class="welcome-title">Добро пожаловать в GigaChat UI!</h1>
            <p class="welcome-description">
              Ваш интеллектуальный помощник на основе нейросети GigaChat
            </p>
          </div>
        `;
      }

      window.sendExample = async function(question) {
        const input = $("messageInput");
        input.value = question;
        await sendCurrent();
      };

      function renderChats() {
        const list = $("chatList");
        list.innerHTML = "";

        for (const chat of state.chats) {
          const el = document.createElement("div");
          el.className = "chat-item" + (chat.id === state.activeChatId ? " active" : "");

          const content = document.createElement("div");
          content.className = "chat-content";

          const headerRow = document.createElement("div");
          headerRow.className = "chat-header-row";

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = chat.title || "Новый чат";

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-chat-btn";
          deleteBtn.innerHTML = "✕";
          deleteBtn.title = "Удалить чат";
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteChat(chat.id);
          };

          headerRow.appendChild(title);
          headerRow.appendChild(deleteBtn);

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = formatDate(chat.created_at);

          content.appendChild(headerRow);
          content.appendChild(meta);
          el.appendChild(content);

          el.addEventListener("click", () => openChat(chat.id));
          list.appendChild(el);
        }
      }

      async function deleteChat(chatId) {
        const chat = state.chats.find(c => c.id === chatId);
        const chatTitle = chat?.title || "Новый чат";

        if (!confirm(`Вы уверены, что хотите удалить чат "${chatTitle}"? Все сообщения будут потеряны.`)) {
          return;
        }

        setStatus("Удаление...");

        try {
          const response = await fetch(`/api/chats/${chatId}`, { method: "DELETE" });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Ошибка удаления");
          }

          const index = state.chats.findIndex(c => c.id === chatId);
          if (index !== -1) {
            state.chats.splice(index, 1);
          }

          if (state.activeChatId === chatId) {
            if (state.chats.length > 0) {
              await openChat(state.chats[0].id);
            } else {
              state.activeChatId = null;
              await createChat();
            }
          }

          renderChats();
          setStatus("Чат удалён");
          setTimeout(() => setStatus(""), 2000);
        } catch (e) {
          setStatus(String(e.message || e));
          setTimeout(() => setStatus(""), 3000);
        }
      }

      function renderMarkdownWithMath(content) {
        let processedContent = content;
        processedContent = processedContent.replace(/C_\{([^}]+)\}\^\{([^}]+)\}/g, '\\binom{$1}{$2}');
        processedContent = processedContent.replace(/C_([a-zA-Z0-9]+)\^([a-zA-Z0-9]+)/g, '\\binom{$1}{$2}');
        processedContent = processedContent.replace(/C_\{([^}]+)\}\^([a-zA-Z0-9]+)/g, '\\binom{$1}{$2}');
        processedContent = processedContent.replace(/C_([a-zA-Z0-9]+)\^\{([^}]+)\}/g, '\\binom{$1}{$2}');

        const html = marked.parse(processedContent);
        const temp = document.createElement('div');
        temp.innerHTML = html;

        if (typeof renderMathInElement === 'function') {
          renderMathInElement(temp, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false,
            errorColor: '#e74c3c'
          });
        }

        return temp.innerHTML;
      }

      function showTypingIndicator() {
        const box = $("messages");
        const indicator = document.createElement("div");
        indicator.className = "msg";
        indicator.id = "typing-indicator";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";

        const bubble = document.createElement("div");
        bubble.className = "bubble assistant";

        const typingDots = document.createElement("div");
        typingDots.className = "typing-indicator";
        typingDots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

        bubble.appendChild(typingDots);
        indicator.appendChild(avatar);
        indicator.appendChild(bubble);

        box.appendChild(indicator);
        box.scrollTop = box.scrollHeight;
      }

      function hideTypingIndicator() {
        const indicator = document.getElementById("typing-indicator");
        if (indicator) {
          indicator.remove();
        }
      }

      async function renderMessages(messages) {
        const box = $("messages");

        if (!messages || messages.length === 0) {
          showWelcomeScreen();
          return;
        }

        box.innerHTML = "";

        for (const m of messages) {
          const row = document.createElement("div");
          row.className = "msg";

          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = m.role === "user" ? "Я" : "AI";

          const bubble = document.createElement("div");
          bubble.className = "bubble " + (m.role === "user" ? "user" : "assistant");

          if (m.role === "user") {
            bubble.textContent = m.content;
          } else {
            try {
              bubble.innerHTML = renderMarkdownWithMath(m.content);
            } catch (e) {
              console.error("Render error:", e);
              bubble.textContent = m.content;
            }
          }

          row.appendChild(avatar);
          row.appendChild(bubble);
          box.appendChild(row);
        }

        box.scrollTop = box.scrollHeight;
      }

      async function api(method, url, body) {
        const opts = { method, headers: {} };
        if (body !== undefined) {
          opts.headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(body);
        }
        const res = await fetch(url, opts);
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try {
            const j = await res.json();
            detail = j.detail || detail;
          } catch {}
          throw new Error(detail);
        }
        return await res.json();
      }

      async function loadChats() {
        try {
          state.chats = await api("GET", "/api/chats");
          renderChats();

          if (state.activeChatId && !state.chats.find(c => c.id === state.activeChatId)) {
            state.activeChatId = null;
            if (state.chats.length > 0) {
              await openChat(state.chats[0].id);
            } else {
              await createChat();
            }
          }
        } catch (e) {
          console.error("Error loading chats:", e);
          setStatus("Ошибка загрузки чатов");
        }
      }

      async function createChat() {
        const chat = await api("POST", "/api/chats", {});
        state.chats.unshift(chat);
        state.activeChatId = chat.id;
        renderChats();
        $("chatTitle").textContent = chat.title || "Новый чат";
        await renderMessages([]);
      }

      async function openChat(chatId) {
        const chat = state.chats.find((c) => c.id === chatId);
        if (!chat) {
          await createChat();
          return;
        }

        state.activeChatId = chatId;
        renderChats();
        $("chatTitle").textContent = chat.title || "Чат";

        setStatus("Загрузка…");
        try {
          const messages = await api("GET", `/api/chats/${encodeURIComponent(chatId)}/messages`);
          await renderMessages(messages);
        } catch (e) {
          console.error("Error loading messages:", e);
          if (e.message.includes("404")) {
            await createChat();
          } else {
            setStatus("Ошибка загрузки");
          }
        } finally {
          setStatus("");
        }
      }

      function setLoading(v) {
        state.loading = v;
        $("sendBtn").disabled = v;
        $("messageInput").disabled = v;
      }

      async function sendCurrent() {
        const input = $("messageInput");
        const text = input.value.trim();
        if (!text) return;

        if (!state.activeChatId) {
          await createChat();
        }

        const chatId = state.activeChatId;
        setLoading(true);
        setStatus("Думаю...");
        showTypingIndicator();

        try {
          const messages = await api("GET", `/api/chats/${encodeURIComponent(chatId)}/messages`);
          messages.push({ role: "user", content: text });
          await renderMessages(messages);
          input.value = "";
          input.style.height = "";

          await api("POST", `/api/chats/${encodeURIComponent(chatId)}/send`, { content: text });

          await loadChats();
          state.activeChatId = chatId;
          renderChats();

          const updated = await api("GET", `/api/chats/${encodeURIComponent(chatId)}/messages`);
          await renderMessages(updated);
        } catch (e) {
          setStatus(String(e.message || e));
        } finally {
          hideTypingIndicator();
          setLoading(false);
          setTimeout(() => setStatus(""), 2500);
        }
      }

      function autoresizeTextarea(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 180) + "px";
      }

      window.addEventListener("DOMContentLoaded", async () => {
        $("newChatBtn").addEventListener("click", async () => {
          await createChat();
        });

        const input = $("messageInput");
        input.addEventListener("input", () => autoresizeTextarea(input));
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendCurrent();
          }
        });

        $("composer").addEventListener("submit", (e) => {
          e.preventDefault();
          sendCurrent();
        });

        setStatus("Загрузка…");
        try {
          await loadChats();
          if (state.chats.length === 0) {
            await createChat();
          } else {
            await openChat(state.chats[0].id);
          }
        } catch (e) {
          setStatus(String(e.message || e));
        } finally {
          setTimeout(() => setStatus(""), 2500);
        }
      });
    </script>
  </body>
</html>
