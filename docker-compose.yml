services:
  app:
    build: .
    container_name: sirius-ai-agent
    expose:
      - "8000"
    environment:
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
      - DB_PATH=/data/chats.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - sirius-net

  nginx:
    image: nginx:alpine
    container_name: sirius-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - sirius-net

networks:
  sirius-net:
    driver: bridge